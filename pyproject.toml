[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tfa-conformer-sid"
version = "0.1.0"
description = "Multi-scale short-utterance speaker identification with TFA-Conformer"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "torch",
  "torchaudio",
  "numpy",
  "pyyaml",
  "tqdm",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

